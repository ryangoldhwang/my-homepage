<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나사렛대학교 CTL 업무현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Unbounded:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0C10; --ink:#F4F5F8; --mute:#8A8F9C; --line:rgba(255,255,255,.08);
  --c1:#7C5CFF; --c2:#00E0FF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#050506;overflow:hidden;color:var(--ink);
  font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
.en{font-family:"Unbounded","Noto Sans KR",system-ui,sans-serif}

/* 1920x1080 stage scaled to fit */
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1920px;height:1080px;flex:none;overflow:hidden;background:var(--bg);
  transform-origin:center center}
#stage.paused *, #stage.paused *::before, #stage.paused *::after{animation-play-state:paused!important}

/* grain + grid */
#stage::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:120px 120px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);opacity:.6}
#stage::after{content:"";position:absolute;inset:0;z-index:50;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.scene{position:absolute;inset:0;z-index:2}

/* ---------- shared keyframes ---------- */
@keyframes rise{from{transform:translateY(110%) rotate(6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(160px) skewX(-8deg)}to{opacity:1;transform:none}}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes marqueeR{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@keyframes orb{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-80px,60px) scale(1.15)}100%{transform:translate(0,0) scale(1)}}
@keyframes numIn{from{opacity:0;transform:translateY(200px) scale(.8)}to{opacity:.16;transform:none}}
@keyframes flash{0%{opacity:0;transform:scale(1.4);filter:blur(20px)}20%{opacity:1;transform:scale(1);filter:blur(0)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9);filter:blur(10px)}}
@keyframes stretch{0%{letter-spacing:.6em;opacity:0}100%{letter-spacing:-.02em;opacity:1}}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}

.mask{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
.mask>span{display:inline-block;animation:rise .7s cubic-bezier(.2,.9,.2,1) both}
.grad{background:linear-gradient(100deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}

.orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55;animation:orb 9s ease-in-out infinite}

/* ---------- INTRO ---------- */
.intro .flashbox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.intro .flashword{position:absolute;font-size:300px;font-weight:900;letter-spacing:-.04em;opacity:0;
  animation:flash .62s cubic-bezier(.2,.9,.2,1) both}
.intro .settle{position:absolute;left:140px;right:100px;top:50%;transform:translateY(-50%)}
.intro .kicker{font-size:28px;letter-spacing:.4em;color:var(--mute);animation:fade .6s both}
.intro h1{font-weight:900;line-height:1.04;letter-spacing:-.045em;margin-top:30px}
.intro h1 .l1{display:block;font-size:136px;white-space:nowrap}
.intro h1 .l2{display:flex;align-items:center;gap:34px;font-size:210px;margin-top:6px}
.intro h1 .sl{display:inline-block;width:18px;height:180px;transform:skewX(-20deg)}
.intro h1 .sl b{display:block;width:100%;height:100%;border-radius:9px;transform-origin:bottom;background:linear-gradient(180deg,#7C5CFF,#00E0FF);box-shadow:0 0 40px rgba(0,224,255,.5);animation:growY .6s cubic-bezier(.7,0,.2,1) both}
.intro h1 .ch{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.06em}
.intro h1 .ch>span{display:inline-block;animation:rise .6s cubic-bezier(.2,.9,.2,1) both}
.intro .chips{display:flex;gap:20px;margin-top:56px}
.site{display:inline-flex;align-items:center;gap:12px;font-family:Unbounded,"Noto Sans KR",sans-serif;font-weight:600;font-size:26px;color:#E7E9EE;text-decoration:none;letter-spacing:.01em;animation:fadeUp .6s cubic-bezier(.2,.9,.2,1) both}
.site:hover{color:#00E0FF}
.site svg{width:28px;height:28px;fill:none;stroke:url(#siteGrad);stroke-width:2}
.intro .site{margin-top:40px}
.outro .foot{position:absolute;left:120px;right:120px;bottom:22px;display:flex;align-items:center;justify-content:space-between}
.cal-foot a{color:#9BA0AB;text-decoration:none}.cal-foot a:hover{color:#00E0FF}
.intro .chip{padding:18px 34px;border-radius:100px;font-size:34px;font-weight:700;
  border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);backdrop-filter:blur(12px);
  animation:popIn .55s cubic-bezier(.2,.9,.2,1) both}
.intro .chip i{font-style:normal;font-family:Unbounded;font-size:22px;margin-right:12px;opacity:.7}

/* ---------- PILLAR ---------- */
.pillar .marq{position:absolute;left:0;white-space:nowrap;font-family:Unbounded;font-weight:900;
  font-size:180px;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.07);
  animation:fade 1s both}
.pillar .marq>div{display:inline-block;animation:marquee 22s linear infinite}
.pillar .marq.r>div{animation-name:marqueeR}
.pillar .bignum{position:absolute;left:90px;bottom:-150px;font-family:Unbounded;font-weight:900;
  font-size:520px;line-height:1;letter-spacing:-.06em;
  animation:numIn 1.2s cubic-bezier(.2,.9,.2,1) both}
.pillar .left{position:absolute;left:120px;top:200px;width:800px;z-index:2}
.pillar .tag{display:flex;align-items:center;gap:18px;font-family:Unbounded;font-size:22px;letter-spacing:.3em;color:var(--mute);animation:fade .5s .1s both}
.pillar .tag b{display:inline-block;width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 24px var(--c2)}
.pillar h2{margin-top:36px;white-space:nowrap;font-size:132px;font-weight:900;line-height:1.05;letter-spacing:-.05em}
.pillar h2 .ch{display:inline-block;overflow:hidden;vertical-align:bottom}
.pillar h2 .ch>span{display:inline-block;animation:rise .65s cubic-bezier(.2,.9,.2,1) both}
.pillar .enlabel{margin-top:30px;font-family:Unbounded;font-weight:600;font-size:34px;letter-spacing:.02em;animation:stretch 1s cubic-bezier(.2,.9,.2,1) both}
.pillar .bar{margin-top:40px;height:8px;width:420px;border-radius:8px;transform-origin:left;
  background:linear-gradient(90deg,var(--c1),var(--c2));animation:sweep .9s cubic-bezier(.7,0,.2,1) both;box-shadow:0 0 40px var(--c2)}
.pillar .count{margin-top:44px;font-size:30px;color:var(--mute);animation:fadeUp .6s both}
.pillar .count strong{color:var(--ink);font-family:Unbounded;font-size:44px;margin-right:8px}

.pillar .cards{position:absolute;z-index:2;right:120px;top:50%;transform:translateY(-50%);width:880px;display:flex;flex-direction:column;gap:22px}
.card{position:relative;display:flex;align-items:center;gap:34px;padding:34px 44px;border-radius:28px;
  background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 20px 60px rgba(0,0,0,.35);
  animation:slideL .7s cubic-bezier(.2,.9,.2,1) both;transition:transform .35s cubic-bezier(.2,.9,.2,1),border-color .35s,background .35s}
.card .idx{font-family:Unbounded;font-weight:800;font-size:30px;min-width:64px;opacity:.5;transition:opacity .35s}
.card .nm{font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.card .nm .mask>span{animation-duration:.6s}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.14) 50%,transparent 70%);background-size:200% 100%}
.card.hot{transform:translateX(-26px) scale(1.025);border-color:var(--c2);
  background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 34%,transparent),color-mix(in srgb,var(--c2) 14%,transparent))}
.card.hot .idx{opacity:1}
.card.hot::after{opacity:1;animation:shine 1.2s linear infinite}
.pillar .cards.five .card{padding:26px 44px}
.pillar .cards.five .card .nm{font-size:42px}

/* ---------- OUTRO ---------- */
.outro .head{position:absolute;left:120px;top:80px;right:120px;display:flex;justify-content:space-between;align-items:flex-end}
.outro h3{font-size:96px;font-weight:900;letter-spacing:-.045em;line-height:1.05}
.outro .sum{font-family:Unbounded;font-size:26px;color:var(--mute);text-align:right;line-height:1.6;animation:fade .8s .6s both}
.outro .sum b{color:var(--ink);font-size:56px;font-weight:800}
.outro .grid{position:absolute;left:120px;right:120px;top:300px;bottom:130px;display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.col{border-radius:30px;padding:40px 36px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(16px);position:relative;overflow:hidden;animation:fadeUp .7s cubic-bezier(.2,.9,.2,1) both}
.col::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:linear-gradient(90deg,var(--a),var(--b))}
.col .cn{font-family:Unbounded;font-weight:800;font-size:22px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.col h4{font-size:46px;font-weight:900;letter-spacing:-.04em;margin:14px 0 30px}
.col ul{list-style:none;display:flex;flex-direction:column;gap:14px}
.col li{font-size:26px;font-weight:500;line-height:1.35;padding:16px 20px;border-radius:16px;background:rgba(255,255,255,.04);
  border-left:4px solid var(--b);animation:fadeUp .5s cubic-bezier(.2,.9,.2,1) both}


/* ---------- LOGO PHASE ---------- */
.logophase{position:absolute;inset:0;z-index:5;background:#fff;animation:wipeOut .75s cubic-bezier(.7,0,.2,1) both}
.logophase::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(90deg,#7C5CFF,#00E0FF,#FF3DCB,#FFB23D);transform-origin:left;animation:sweep 1.4s .2s cubic-bezier(.7,0,.2,1) both}
.lp{position:absolute;display:block}
.lp img{display:block;width:100%;height:100%}
.lp.seal{animation:sealIn 1s cubic-bezier(.2,.9,.2,1) both}
.lp.ctl{overflow:hidden}.lp.ctl img{animation:rise .8s cubic-bezier(.2,.9,.2,1) both;animation-delay:inherit}
.lp.sub{animation:fadeUp .7s cubic-bezier(.2,.9,.2,1) both}
.lp.div{transform-origin:top;animation:growY .6s cubic-bezier(.7,0,.2,1) both}
.lp.kr{animation:reveal .9s cubic-bezier(.7,0,.2,1) both}
@keyframes sealIn{from{opacity:0;transform:rotate(-200deg) scale(.3)}to{opacity:1;transform:none}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0);transform:translateX(-30px)}to{clip-path:inset(0 0 0 0);transform:none}}
@keyframes wipeOut{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 100% 0)}}
.badge{display:inline-flex;align-items:center;gap:18px;padding:12px 30px 12px 14px;border-radius:100px;background:#fff;color:#111;
  box-shadow:0 10px 40px rgba(0,0,0,.35);animation:popIn .6s cubic-bezier(.2,.9,.2,1) both}
.badge img{width:58px;height:58px}
.badge span{font-size:26px;font-weight:700;letter-spacing:-.02em}
.badge b{font-family:Unbounded;font-weight:800;font-size:24px;margin-right:2px}


/* ---------- WEEKLY CALENDAR SIDEBAR (compact) ---------- */
:root{--sb:340px}
body.sb-closed{--sb:0px}
#viewport{right:var(--sb);transition:right .45s cubic-bezier(.7,0,.2,1)}
#ui{left:calc((100vw - var(--sb))/2)!important;transition:left .45s cubic-bezier(.7,0,.2,1),opacity .4s}
#cal{position:fixed;top:0;right:0;bottom:0;width:340px;z-index:90;display:flex;flex-direction:column;
  background:rgba(14,15,20,.97);border-left:1px solid rgba(255,255,255,.08);transition:transform .45s cubic-bezier(.7,0,.2,1)}
body.sb-closed #cal{transform:translateX(100%)}
#cal::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,#7C5CFF,#00E0FF,#FF3DCB,#FFB23D);opacity:.6}
#calToggle{all:unset;cursor:pointer;position:absolute;left:-30px;top:50%;transform:translateY(-50%);width:30px;height:64px;border-radius:10px 0 0 10px;
  background:rgba(14,15,20,.97);border:1px solid rgba(255,255,255,.1);border-right:0;display:grid;place-items:center;color:#cfd3dc}
#calToggle:hover,#calToggle:focus-visible{color:#fff}
#calToggle svg{width:14px;height:14px;fill:currentColor;transition:transform .45s}
body.sb-closed #calToggle svg{transform:rotate(180deg)}
.cal-head{display:flex;align-items:baseline;gap:8px;padding:12px 14px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
.cal-title{font-size:15px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.cal-title i{width:6px;height:6px;border-radius:50%;background:#00F5A0;box-shadow:0 0 6px #00F5A0}
.cal-range{font-size:11.5px;color:#8A8F9C}
.yt{flex:none;padding:10px 10px 9px;border-bottom:1px solid rgba(255,255,255,.06)}
.yt.bottom{border-bottom:0;border-top:1px solid rgba(255,255,255,.06)}
.yt-h{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;margin-bottom:7px}
.yt-h i{width:16px;height:11px;border-radius:3px;background:#FF0033;position:relative;flex:none}
.yt-h i::after{content:"";position:absolute;left:6px;top:3px;border-left:5px solid #fff;border-top:2.5px solid transparent;border-bottom:2.5px solid transparent}
.yt-h span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yt-h a,.yt-h button{all:unset;cursor:pointer;font-size:10.5px;font-weight:600;color:#9BA0AB;padding:2px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.14);white-space:nowrap}
.yt-h a:hover,.yt-h button:hover,.yt-h a:focus-visible,.yt-h button:focus-visible{color:#fff}
.yt-frame{position:relative;border-radius:10px;overflow:hidden;background:#000;width:100%;height:200px}
.yt-frame.v{width:auto;aspect-ratio:9/16;height:min(52vh,560px);margin:0 auto}
.yt-frame iframe,.yt-frame>div{position:absolute;inset:0;width:100%!important;height:100%!important;border:0}
.yt-now{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:11.5px;color:#C8CBD3;min-height:16px}
.yt-now b{flex:none;font-size:9.5px;font-weight:800;letter-spacing:.08em;color:#00F5A0}
.yt-now span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yt-ctl{display:flex;align-items:center;gap:4px;margin-top:6px}
.yt-ctl button{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#dfe2e8}
.yt-ctl button:hover,.yt-ctl button:focus-visible{background:rgba(255,255,255,.1)}
.yt-ctl button.main{width:36px;height:36px;background:linear-gradient(135deg,#FF3D6E,#FF0033);color:#fff}
.yt-ctl button.on{color:#00F5A0}
.yt-ctl svg{width:15px;height:15px;fill:currentColor}
.yt-ctl input[type=range]{flex:1;min-width:60px;accent-color:#FF3D6E;height:4px}
.yt-hint{margin-top:5px;font-size:10.5px;color:#7C818D;line-height:1.45}
.yt.min .yt-frame,.yt.min .yt-ctl,.yt.min .yt-now,.yt.min .yt-hint{display:none}
.yt.min .yt-h{margin-bottom:0}
.cal-body{flex:1;overflow-y:auto;padding:0 8px 6px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.wk-sep{display:flex;align-items:center;gap:8px;margin:10px 4px 2px;font-size:10px;font-weight:800;letter-spacing:.12em;color:#7C818D}
.wk-sep.first{margin-top:6px}
.wk-sep::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.1)}
.day{padding:5px 4px 3px;border-bottom:1px solid rgba(255,255,255,.05)}
.day.past{opacity:.45}
.day.empty{padding-top:3px;padding-bottom:3px}
.day.today{background:rgba(0,224,255,.07);border-radius:8px;border-bottom-color:transparent;box-shadow:inset 2px 0 0 #00E0FF}
.day-h{display:flex;align-items:baseline;gap:6px;padding:2px 4px 2px}
.day-h b{font-size:12.5px;font-weight:800}
.day-h span{font-size:11px;color:#8A8F9C}
.day-h em{margin-left:auto;font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.06em;color:#00E0FF}
.ev{display:flex;align-items:baseline;gap:7px;padding:2px 4px 2px 6px;border-left:2px solid var(--ec,#7C5CFF);margin:2px 0 2px 4px;line-height:1.35}
.ev .t{font-size:11px;color:#9BA0AB;min-width:68px;flex:none;font-variant-numeric:tabular-nums}
.ev .n{font-size:12.5px;font-weight:500;color:#E7E9EE;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev.now{background:rgba(0,245,160,.1);border-radius:0 6px 6px 0}
.ev.now .t{color:#00F5A0;font-weight:700}
.ev.done{opacity:.5}
.none{font-size:11px;color:#5F6470;padding:1px 10px 3px}
.cal-foot{padding:6px 12px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:8px;font-size:10.5px;color:#7C818D}
.cal-foot button{all:unset;cursor:pointer;margin-left:auto;font-size:10.5px;padding:3px 9px;border-radius:12px;border:1px solid rgba(255,255,255,.15);color:#dfe2e8}
.cal-foot button:hover,.cal-foot button:focus-visible{background:rgba(255,255,255,.08)}
.cal-msg{margin:12px 4px;padding:12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.15);font-size:12.5px;line-height:1.55;color:#C8CBD3}
.cal-msg b{display:block;color:#fff;margin-bottom:3px}
.cal-msg button{all:unset;cursor:pointer;margin-top:8px;display:inline-block;padding:5px 12px;border-radius:14px;background:#fff;color:#111;font-weight:700;font-size:12px}
.skel{height:40px;border-radius:8px;margin-top:8px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:shine 1.4s linear infinite}
@media (max-width:900px){:root{--sb:280px} #cal{width:280px}}

/* ---------- controls ---------- */
#ui{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:14px;
  padding:10px 14px;border-radius:100px;background:rgba(20,21,26,.72);border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:opacity .4s}
#ui.idle{opacity:0}
#ui button{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:background .2s}
#ui button:hover,#ui button:focus-visible{background:rgba(255,255,255,.12)}
#ui svg{width:18px;height:18px;fill:currentColor}
#ui #loop{width:auto;padding:0 14px;border-radius:20px;gap:6px;display:flex;font-size:13px;font-weight:700;color:#8A8F9C;border:1px solid rgba(255,255,255,.14)}
#ui #loop.on{color:#0B0C10;background:linear-gradient(90deg,#00F5A0,#00E0FF);border-color:transparent}
#segs{display:flex;gap:6px;padding:0 6px}
.seg{width:46px;height:6px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;cursor:pointer}
.seg>i{display:block;height:100%;width:0;background:#fff}
#label{font-size:13px;color:#C8CBD3;min-width:96px;text-align:center;white-space:nowrap}
@media (max-width:640px){.seg{width:22px}#label{display:none}}

@media (prefers-reduced-motion:reduce){
  #stage *{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important}
  .card{transition:none}

const stage = document.getElementById("stage");
const segs = document.getElementById("segs");
const label = document.getElementById("label");
const playBtn = document.getElementById("play");
const playIcon = document.getElementById("playIcon");
const ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
const ICON_PLAY  = '<path d="M7 4v16l13-8z"/>';

SCENES.forEach((s,i)=>{
  const d = document.createElement("div"); d.className="seg"; d.title=s.name; d.innerHTML="<i></i>";
  d.addEventListener("click",()=>go(i)); segs.appendChild(d);
});

let loopOn=true, cur=0, elapsed=0, playing=true, last=performance.now(), cards=[];

function go(i){
  cur = Math.max(0,Math.min(SCENES.length-1,i));
  elapsed = 0;
  stage.innerHTML = SCENES[cur].render();
  cards = [...stage.querySelectorAll(".card")];
  label.textContent = SCENES[cur].name;
  [...segs.children].forEach((s,k)=>s.firstChild.style.width = k<cur ? "100%" : "0");
  if(!playing) setPlaying(true);
}
function setPlaying(v){
  playing=v; last=performance.now();
  stage.classList.toggle("paused",!v);
  playIcon.innerHTML = v ? ICON_PAUSE : ICON_PLAY;
  playBtn.setAttribute("aria-label", v ? "일시정지" : "재생");
}
function tick(now){
  const dt = now-last; last=now;
  if(playing){
    const sc = SCENES[cur];
    elapsed += dt;
    segs.children[cur].firstChild.style.width = Math.min(100,elapsed/sc.dur*100)+"%";
    if(sc.spot){
      const k = Math.floor((elapsed-sc.spot.start)/sc.spot.step);
      cards.forEach((c,j)=>c.classList.toggle("hot", j===k));
    }
    if(elapsed>=sc.dur){
      if(cur<SCENES.length-1) go(cur+1);
      else if(loopOn) go(0);
      else { elapsed=sc.dur; setPlaying(false); }
    }
  }
  requestAnimationFrame(tick);
}

document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
document.getElementById("replay").onclick=()=>go(0);
const loopBtn=document.getElementById("loop");
try{ if(localStorage.getItem("ctlLoop")==="0") loopOn=false; }catch(e){}
function syncLoop(){ loopBtn.classList.toggle("on",loopOn); loopBtn.setAttribute("aria-pressed",String(loopOn)); loopBtn.setAttribute("aria-label",`계속 다시보기 ${loopOn?"켜짐":"꺼짐"}`); }
loopBtn.onclick=()=>{ loopOn=!loopOn; syncLoop(); try{localStorage.setItem("ctlLoop",loopOn?"1":"0")}catch(e){}
  if(loopOn && !playing && cur===SCENES.length-1 && elapsed>=SCENES[cur].dur) go(0); };
syncLoop();
playBtn.onclick=()=>{
  if(!playing && cur===SCENES.length-1 && elapsed>=SCENES[cur].dur) return go(0);
  setPlaying(!playing);
};
addEventListener("keydown",e=>{
  if(e.key===" "){e.preventDefault();playBtn.click();}
  else if(e.key==="ArrowRight") go(cur+1);
  else if(e.key==="ArrowLeft") go(cur-1);
  else if(e.key.toLowerCase()==="r") go(0);
  else if(e.key.toLowerCase()==="l") loopBtn.click();
});

const CAL = { tz:"Asia/Seoul" };
const DOW = ["일","월","화","수","목","금","토"];
const GCOLOR = {"1":"#7986CB","2":"#33B679","3":"#8E24AA","4":"#E67C73","5":"#F6BF26","6":"#F4511E","7":"#039BE5","8":"#616161","9":"#3F51B5","10":"#0B8043","11":"#D50000"};
const calBody=document.getElementById("calBody"), calRange=document.getElementById("calRange"), calStamp=document.getElementById("calStamp");
const pad=n=>String(n).padStart(2,"0");
const fmtParts = new Intl.DateTimeFormat("en-CA",{timeZone:CAL.tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
function seoul(d){ const o={}; fmtParts.formatToParts(d).forEach(p=>o[p.type]=p.value); return {ymd:`${o.year}-${o.month}-${o.day}`, hm:`${o.hour}:${o.minute}`}; }
function addDays(ymd,n){ const d=new Date(ymd+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function dow(ymd){ return new Date(ymd+"T00:00:00Z").getUTCDay(); }
function weekDays(){
  const today=seoul(new Date()).ymd, w=dow(today);
  // 이번 주 + 다음 주 평일(월–금 ×2). 토·일에는 다가오는 주부터 2주
  const mon = w===0 ? addDays(today,1) : w===6 ? addDays(today,2) : addDays(today,1-w);
  return [0,1,2,3,4,7,8,9,10,11].map(i=>addDays(mon,i));
}
let calData=null, calAnimated=false;

function groupEvents(events, days){
  const map={}; days.forEach(d=>map[d]=[]);
  (events||[]).forEach(e=>{
    if(e.status==="cancelled") return;
    if(e.start?.date){ // all-day, end exclusive
      days.forEach(d=>{ if(d>=e.start.date && d<(e.end?.date||addDays(e.start.date,1))) map[d].push({e,allDay:true}); });
    } else if(e.start?.dateTime){
      const st=new Date(e.start.dateTime), en=new Date(e.end?.dateTime||e.start.dateTime);
      days.forEach(d=>{
        const s0=seoul(st).ymd, e0=seoul(new Date(en.getTime()-1)).ymd;
        if(d>=s0 && d<=e0) map[d].push({e,st,en,allDay:false,first:d===s0});
      });
    }
  });
  days.forEach(d=>map[d].sort((a,b)=>(b.allDay-a.allDay)||((a.st||0)-(b.st||0))));
  return map;
}

function renderCal(){
  const days=weekDays(), now=new Date(), today=seoul(now).ymd;
  const f=d=>{const [y,m,dd]=d.split("-");return `${+m}.${+dd}(${DOW[dow(d)]})`;};
  calRange.textContent=`${f(days[0])} – ${f(days[days.length-1])}`;
  if(!calData) return;
  const map=groupEvents(calData.events, days);
  const anim=!calAnimated; calAnimated=true;
  calBody.innerHTML = days.map((d,i)=>{
    const cls = d===today?"today":(d<today?"past":"");
    const items = map[d].map(({e,st,en,allDay})=>{
      let t, state="";
      if(allDay) t="종일";
      else { t=`${seoul(st).hm}–${seoul(en).hm}`; if(now>=st&&now<en) state="now"; else if(now>=en) state="done"; }
      const c = GCOLOR[e.colorId] || "#7C5CFF";
      return `<div class="ev ${state}" style="--ec:${c}"><span class="t">${t}</span><span class="n">${esc(e.summary||"(제목 없음)")}</span></div>`;
    }).join("");
    const [,m,dd]=d.split("-");
    const sep = i===5 ? `<div class="wk-sep"><span>다음 주</span></div>` : (i===0 ? `<div class="wk-sep first"><span>이번 주</span></div>` : "");
    return sep+`<section class="day ${cls} ${map[d].length?"":"empty"}"><div class="day-h"><b>${+m}/${+dd} (${DOW[dow(d)]})</b><span>${map[d].length?map[d].length+"건":"일정 없음"}</span>${d===today?"<em>TODAY</em>":""}</div>${items}</section>`;
  }).join("");
  const t=calBody.querySelector(".day.today"); if(t && anim) t.scrollIntoView({block:"nearest"});
}

function configured(){ return CONFIG.API_KEY && !CONFIG.API_KEY.startsWith("여기에") && CONFIG.CALENDAR_ID && !CONFIG.CALENDAR_ID.startsWith("여기에"); }

let calTimer=null, loading=false;
async function loadCal(){
  if(loading) return; loading=true;
  const days=weekDays();
  const q=new URLSearchParams({
    key:CONFIG.API_KEY, singleEvents:"true", orderBy:"startTime", maxResults:"250", timeZone:CAL.tz,
    timeMin:`${days[0]}T00:00:00+09:00`, timeMax:`${addDays(days[days.length-1],1)}T00:00:00+09:00`
  });
  const url=`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CONFIG.CALENDAR_ID)}/events?${q}`;
  try{
    const r=await fetch(url,{cache:"no-store"});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){
      const st=r.status, msg=j?.error?.message||"";
      if(!calData){
        if(st===404) calMessage("캘린더를 찾을 수 없어요","CALENDAR_ID가 맞는지, 캘린더가 <b style='display:inline'>공개</b>로 설정돼 있는지 확인해 주세요.");
        else if(st===403 && /referer|referrer/i.test(msg)) calMessage("이 주소에서는 API 키를 쓸 수 없어요","API 키의 웹사이트 제한에 지금 페이지 주소를 추가해 주세요.");
        else if(st===403 || st===400) calMessage("API 키를 확인해 주세요","키가 올바른지, Google Calendar API가 사용 설정됐는지 확인해 주세요.<br><small>"+esc(msg)+"</small>");
        else calMessage("일정을 불러오지 못했어요",esc(msg||("HTTP "+st)));
      }
      calStamp.textContent="불러오기 실패"+(calData?" · 이전 데이터 표시":"");
      return;
    }
    const hide=(CONFIG.HIDE_WORDS||[]).filter(Boolean);
    calData={events:(j.items||[]).filter(e=>!hide.some(w=>(e.summary||"").includes(w)))};
    calStamp.textContent=`업데이트 ${seoul(new Date()).hm}`;
    renderCal();
  }catch(e){
    if(!calData) calMessage("네트워크에 연결할 수 없어요","인터넷 연결을 확인해 주세요. 자동으로 다시 시도합니다.");
    calStamp.textContent="연결 지연"+(calData?" · 이전 데이터 표시":"");
  }finally{ loading=false; }
}

function parseYT(u){
  try{
    const url=new URL(u.trim()); const h=url.hostname.replace(/^www\.|^m\./,"");
    const list=url.searchParams.get("list");
    let id=null, shorts=false;
    if(h==="youtu.be") id=url.pathname.slice(1).split("/")[0];
    else if(/youtube(-nocookie)?\.com$/.test(h)){
      const p=url.pathname.split("/").filter(Boolean);
      if(p[0]==="watch") id=url.searchParams.get("v");
      else if(["shorts","embed","live","v"].includes(p[0])){ id=p[1]; shorts=p[0]==="shorts"; }
    }
    if(id && !/^[\w-]{6,20}$/.test(id)) id=null;
    if(list && !/^[\w-]{10,64}$/.test(list)) return id?{id,shorts}:null;
    return (id||list)?{id,list,shorts}:null;
  }catch(e){ return null; }
}

      <button type="button" data-k="mute" aria-label="음소거">${ic("vol")}</button>
      <input type="range" min="0" max="100" value="${Math.max(0,Math.min(100,+Y.VOLUME||40))}" aria-label="볼륨">
    </div>
    <div class="yt-hint">로그인은 새 탭에서 진행돼요. 로그인 후 이 페이지를 새로고침하면 플레이어에 반영됩니다.</div></div>`;
  const box=host.firstElementChild, $=k=>box.querySelector(`[data-k="${k}"]`), vol=box.querySelector('input[type=range]'), now=box.querySelector("#ytNow");
  let player=null, ready=false, shuffle=!!Y.SHUFFLE, playing=false;
  const setPlayIcon=()=>{ $("play").innerHTML=ic(playing?"pause":"play"); $("play").setAttribute("aria-label",playing?"일시정지":"재생"); };
  const setShuf=()=>{ $("shuf").classList.toggle("on",shuffle); $("shuf").setAttribute("aria-pressed",String(shuffle)); };
  const setMuteIcon=()=>{ const m=player&&ready&&player.isMuted(); $("mute").innerHTML=ic(m?"mute":"vol"); };
  setShuf();
  function build(){
    const pv={playsinline:1,rel:0,autoplay:Y.AUTOPLAY?1:0,origin:location.origin};
    const opts={width:"100%",height:"100%",host:"https://www.youtube.com",playerVars:pv,events:{
      onReady:()=>{ ready=true; player.setVolume(+vol.value); if(shuffle&&v.list) player.setShuffle(true); setMuteIcon(); },
      onStateChange:e=>{ playing=e.data===1||e.data===3; setPlayIcon(); const d=player.getVideoData&&player.getVideoData(); if(d&&d.title) now.textContent=d.title+(d.author?` · ${d.author}`:""); },
      onError:e=>{ const m={2:"주소 형식이 올바르지 않아요",5:"이 브라우저에서 재생할 수 없어요",100:"삭제됐거나 비공개인 영상이에요",101:"퍼가기가 허용되지 않은 곡이에요",150:"퍼가기가 허용되지 않은 곡이에요",153:"재생 정보 확인에 실패했어요"}[e.data]||"재생 오류";
        now.textContent=`${m} — 다음 곡으로 넘어갑니다`; if(v.list) setTimeout(()=>player.nextVideo(),1500); }
    }};
    if(v.list){ pv.listType="playlist"; pv.list=v.list; if(v.id) opts.videoId=v.id; } else { opts.videoId=v.id; pv.loop=1; pv.playlist=v.id; }
    player=new YT.Player("ytPlayer",opts);
  }
  function loadAPI(){
    if(window.YT&&YT.Player) return build();
    const prev=window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady=()=>{ prev&&prev(); build(); };
    const sc=document.createElement("script"); sc.src="https://www.youtube.com/iframe_api"; sc.onerror=()=>{ now.textContent="유튜브에 연결할 수 없어요 (네트워크 확인)"; }; document.head.appendChild(sc);
  }
  if(!collapsed) loadAPI();
  $("play").onclick=()=>{ if(!ready) return; playing?player.pauseVideo():player.playVideo(); };
  $("prev").onclick=()=>ready&&player.previousVideo();
  $("next").onclick=()=>ready&&player.nextVideo();
  $("shuf").onclick=()=>{ shuffle=!shuffle; setShuf(); if(ready&&v.list) player.setShuffle(shuffle); };
  $("mute").onclick=()=>{ if(!ready) return; player.isMuted()?player.unMute():player.mute(); setTimeout(setMuteIcon,50); };
  vol.oninput=()=>{ if(ready){ player.setVolume(+vol.value); if(+vol.value>0&&player.isMuted()) player.unMute(); setMuteIcon(); } };
  $("min").onclick=()=>{
    collapsed=!collapsed; box.classList.toggle("min",collapsed);
    $("min").textContent=collapsed?"펼치기":"접기"; $("min").setAttribute("aria-expanded",String(!collapsed));
    if(collapsed){ if(ready) player.pauseVideo(); }   // 플레이어를 가리면 재생도 멈춤
    else if(!player) loadAPI();
    try{ localStorage.setItem("ctlYtMin",collapsed?"1":"0"); }catch(e){}
  };
})();

let lastWeek=weekDays()[0];
renderCal();
if(!configured()){
  calMessage("캘린더 설정이 필요해요","HTML 파일 상단의 <b style='display:inline'>CONFIG</b>에 API 키와 캘린더 ID를 입력해 주세요.");
  calStamp.textContent="설정 전";
}else{
  loadCal();
  setInterval(loadCal, Math.max(1,CONFIG.REFRESH_MIN)*60000);
  setInterval(()=>{ const w=weekDays()[0]; if(w!==lastWeek){ lastWeek=w; calData=null; loadCal(); } else renderCal(); },60000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) loadCal(); });
}
</script>
</body>
</html>
